name: macOS Universal Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thumper-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify macOS Universal Release
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Apple build tools
        run: |
          xcodebuild -version
          cmake --version

      - name: Build, package, and verify
        run: bash scripts/build-macos-release.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: THUMPER-macOS-${{ github.ref_name }}
          path: build/macos-universal-release/THUMPER-macOS.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-github-release.sh "$GITHUB_REF_NAME" build/macos-universal-release/THUMPER-macOS.zip
